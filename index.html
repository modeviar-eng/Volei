<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vôlei Pro - Sorteador e Placar Máximo</title>
    <style>
        :root {
            --primary: #003566;
            --secondary: #ffc300;
            --accent: #000814;
            --white: #ffffff;
            --danger: #e63946;
            --success: #2a9d8f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

        .setup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .options {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-draw { background: var(--secondary); color: var(--accent); width: 100%; font-size: 1.1em; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .court-area {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            margin-top: 40px;
            display: none;
        }

        .team-card {
            background: #fff;
            border: 4px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .team-b { border-color: var(--secondary); }

        /* --- PLACAR GIGANTE --- */
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            background: #f0f2f5;
            padding: 15px;
            border-radius: 15px;
        }

        .score-display {
            font-size: 6em; /* Tamanho aumentado para visibilidade na quadra */
            font-weight: 900;
            color: var(--accent);
            min-width: 140px;
            line-height: 1;
            font-family: 'Courier New', Courier, monospace; /* Fonte mais quadrada para estilo de placar */
        }

        .btn-score {
            padding: 15px 25px;
            font-size: 1.5em;
            background: #cbd5e0;
            color: var(--accent);
            border-radius: 10px;
        }

        .btn-score.plus { background: var(--primary); color: white; }
        .btn-score.plus-b { background: var(--secondary); color: var(--accent); }

        .vs-divider {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5em;
            color: #ccc;
        }

        .player-tag {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 5px;
            margin: 5px;
            display: inline-block;
            font-weight: 600;
        }

        .status-box {
            font-size: 1em;
            height: 45px;
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 5px;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-win { background: var(--success); color: white; margin-top: 20px; width: 100%; font-size: 1.1em; }

        .waiting-list {
            margin-top: 30px;
            border-top: 2px dashed #ddd;
            padding-top: 20px;
        }

        .list-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .badge-waiting { background: #6c757d; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏐 Vôlei Match Maker</h1>

    <div id="setup">
        <div class="setup-grid">
            <div>
                <label>Adicionar Jogadores:</label>
                <input type="text" id="playerName" placeholder="Pressione Enter" onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addPlayer()">Adicionar</button>
                <p><small>Total: <span id="totalCount">0</span></small></p>
            </div>
            <div>
                <label>Jogadores por Time:</label>
                <input type="number" id="teamSize" value="6" min="1">
                <div class="options" style="margin-top: 15px;">
                    <label><input type="checkbox" id="drawSide"> Lado (Início)</label>
                    <label><input type="checkbox" id="drawBall"> Bola (Início)</label>
                </div>
            </div>
        </div>
        <div id="playerPool" style="margin-bottom: 20px;"></div>
        <button class="btn-draw" onclick="initialDraw()">SORTEAR PARTIDA INICIAL</button>
    </div>

    <div id="court" class="court-area">
        <div class="team-card team-a">
            <div id="statusA" class="status-box"></div>
            <h3>Time A</h3>
            
            <div class="score-container">
                <button class="btn-score" onclick="changeScore('A', -1)">-</button>
                <div id="scoreA" class="score-display">00</div>
                <button class="btn-score plus" onclick="changeScore('A', 1)">+</button>
            </div>

            <div id="playersA"></div>
            <button class="btn-win" onclick="teamWins('A')">Venceu (Fica)</button>
        </div>

        <div class="vs-divider">VS</div>

        <div class="team-card team-b">
            <div id="statusB" class="status-box"></div>
            <h3>Time B</h3>

            <div class="score-container">
                <button class="btn-score" onclick="changeScore('B', -1)">-</button>
                <div id="scoreB" class="score-display">00</div>
                <button class="btn-score plus-b" onclick="changeScore('B', 1)">+</button>
            </div>

            <div id="playersB"></div>
            <button class="btn-win" onclick="teamWins('B')">Venceu (Fica)</button>
        </div>
    </div>

    <div class="waiting-list" id="waitingSection" style="display:none;">
        <h4>Próximos da Fila:</h4>
        <div id="waitingListUI" class="list-container"></div>
    </div>
</div>

<script>
    let allPlayers = [];
    let teamA = [];
    let teamB = [];
    let waitingQueue = [];
    let scoreA = 0;
    let scoreB = 0;

    function handleKeyPress(e) { if(e.key === 'Enter') addPlayer(); }

    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (name && !allPlayers.includes(name)) {
            allPlayers.push(name);
            input.value = '';
            updatePool();
        }
    }

    function updatePool() {
        document.getElementById('totalCount').innerText = allPlayers.length;
        document.getElementById('playerPool').innerHTML = allPlayers.map(p => `<span class="player-tag">${p}</span>`).join('');
    }

    function changeScore(team, val) {
        if (team === 'A') {
            scoreA = Math.max(0, scoreA + val);
            document.getElementById('scoreA').innerText = scoreA.toString().padStart(2, '0');
        } else {
            scoreB = Math.max(0, scoreB + val);
            document.getElementById('scoreB').innerText = scoreB.toString().padStart(2, '0');
        }
    }

    function resetScores() {
        scoreA = 0;
        scoreB = 0;
        document.getElementById('scoreA').innerText = "00";
        document.getElementById('scoreB').innerText = "00";
    }

    function initialDraw() {
        const size = parseInt(document.getElementById('teamSize').value);
        if (allPlayers.length < size * 2) return alert("Jogadores insuficientes!");

        const shuffled = [...allPlayers].sort(() => Math.random() - 0.5);
        teamA = shuffled.slice(0, size);
        teamB = shuffled.slice(size, size * 2);
        waitingQueue = shuffled.slice(size * 2);

        resetScores();
        renderPlayers();

        document.getElementById('statusA').innerHTML = "";
        document.getElementById('statusB').innerHTML = "";

        if(document.getElementById('drawSide').checked) {
            const ladoA = Math.random() > 0.5 ? "Esquerda" : "Direita";
            document.getElementById('statusA').innerHTML = `Lado: ${ladoA}`;
            document.getElementById('statusB').innerHTML = `Lado: ${ladoA === "Esquerda" ? "Direita" : "Esquerda"}`;
        }

        if(document.getElementById('drawBall').checked) {
            const b = Math.random() > 0.5 ? 'A' : 'B';
            document.getElementById('status' + b).innerHTML += (document.getElementById('status' + b).innerHTML ? " | " : "") + "🏐 Bola";
        }

        document.getElementById('setup').style.display = 'none';
        document.getElementById('court').style.display = 'grid';
        document.getElementById('waitingSection').style.display = 'block';
    }

    function renderPlayers() {
        document.getElementById('playersA').innerHTML = teamA.map(p => `<div class="player-tag">${p}</div>`).join('');
        document.getElementById('playersB').innerHTML = teamB.map(p => `<div class="player-tag">${p}</div>`).join('');
        document.getElementById('waitingListUI').innerHTML = waitingQueue.map(p => `<span class="badge-waiting">${p}</span>`).join('');
    }

    function teamWins(winner) {
        const size = parseInt(document.getElementById('teamSize').value);
        resetScores();
        
        document.getElementById('statusA').innerHTML = winner === 'A' ? "🏆 Vencedor" : "";
        document.getElementById('statusB').innerHTML = winner === 'B' ? "🏆 Vencedor" : "";

        if (winner === 'A') {
            waitingQueue.push(...teamB);
            teamB = waitingQueue.splice(0, size);
        } else {
            waitingQueue.push(...teamA);
            teamA = waitingQueue.splice(0, size);
        }
        renderPlayers();
    }
</script>
</body>
</html>
