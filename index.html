<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyMaster - Firebase Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-active { border-bottom: 3px solid #fbbf24; color: #fbbf24; }
        body { background: radial-gradient(circle at top left, #1e293b, #0f172a); min-height: 100vh; color: white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-amber-400 italic tracking-tighter uppercase">
                <i class="fas fa-volleyball-ball mr-2"></i>VolleyMaster
            </h1>
            <p class="text-slate-400">Database Realtime Ativo - <span id="currentDate" class="text-amber-400 font-bold"></span></p>
        </header>

        <nav class="flex flex-wrap justify-center gap-4 mb-8 border-b border-slate-700 pb-2">
            <button onclick="showTab('cadastro')" class="nav-link px-4 py-2 font-bold uppercase transition hover:text-amber-400" id="btn-cadastro">Cadastro</button>
            <button onclick="showTab('times')" class="nav-link px-4 py-2 font-bold uppercase transition hover:text-amber-400" id="btn-times">Modo Times</button>
            <button onclick="showTab('continuo')" class="nav-link px-4 py-2 font-bold uppercase transition hover:text-amber-400" id="btn-continuo">Modo Contínuo</button>
        </nav>

        <main class="glass rounded-3xl p-6 shadow-2xl">
            <section id="tab-cadastro" class="tab-content">
                <h2 class="text-2xl font-bold mb-4">Gerenciar Jogadores</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <input type="text" id="playerName" placeholder="Nome do Jogador" class="bg-slate-800 p-3 rounded-lg outline-none border border-slate-600 focus:border-amber-400 text-white">
                    <select id="playerStars" class="bg-slate-800 p-3 rounded-lg outline-none border border-slate-600 focus:border-amber-400 text-white">
                        <option value="1">⭐ Iniciante</option>
                        <option value="2">⭐⭐ Intermediário</option>
                        <option value="3">⭐⭐⭐ Avançado</option>
                    </select>
                    <button id="addPlayerBtn" onclick="addPlayer()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition">Adicionar e Salvar</button>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-4">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-4">
                        <h3 class="font-bold text-white">Lista no Banco (<span id="count">0</span>)</h3>
                        <input type="text" id="searchPlayer" oninput="renderPlayers()" placeholder="Pesquisar jogador..." class="bg-slate-700 px-3 py-1.5 rounded-lg text-sm outline-none border border-slate-600 focus:border-amber-400 text-white w-full sm:w-48">
                    </div>
                    <ul id="playerList" class="grid grid-cols-2 md:grid-cols-4 gap-2"></ul>
                </div>
            </section>

            <section id="tab-modos" class="tab-content hidden">
                <div class="flex gap-4 mb-6 justify-center">
                    <button onclick="showSubTab('sorteio')" class="bg-slate-700 px-6 py-1 rounded-full text-sm font-bold uppercase text-white" id="sub-sorteio">Sorteio</button>
                    <button onclick="showSubTab('partida')" class="bg-slate-700 px-6 py-1 rounded-full text-sm font-bold uppercase text-white" id="sub-partida">Partida</button>
                </div>

                <div id="sub-content-sorteio">
                    <div class="flex flex-wrap gap-4 mb-8 items-end bg-slate-800/40 p-4 rounded-xl">
                        <div class="flex-1 min-w-[150px]">
                            <label class="block text-xs uppercase text-slate-400 mb-1">Jogadores por Time</label>
                            <input type="number" id="playersPerTeam" value="4" class="w-full bg-slate-700 p-2 rounded text-white">
                        </div>
                        <div id="extra-options" class="flex-1"></div>
                        <div class="flex gap-2">
                            <button onclick="toggleBall()" class="p-2 bg-slate-700 rounded-lg hover:bg-amber-500 transition text-white"><i class="fas fa-volleyball"></i> Bola</button>
                            <button onclick="sortField()" class="p-2 bg-slate-700 rounded-lg hover:bg-blue-500 transition text-white"><i class="fas fa-map"></i> Campo</button>
                        </div>
                        <button onclick="drawTeams()" class="bg-green-600 hover:bg-green-700 px-8 py-2 rounded-lg font-bold uppercase shadow-lg text-white">Sortear!</button>
                    </div>
                    <div id="drawResults" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
                </div>

                <div id="sub-content-partida" class="hidden">
                    <div class="flex flex-col items-center">
                        <div class="flex justify-between w-full max-w-4xl items-start bg-slate-800 p-8 rounded-3xl shadow-inner border-4 border-slate-700">
                            <div class="text-center flex-1">
                                <h3 id="scoreNameA" class="text-xl font-bold mb-2 text-amber-400">Time A</h3>
                                <div id="scoreA" class="text-7xl font-black text-white mb-4">0</div>
                                <div class="flex justify-center gap-2 mb-4">
                                    <button onclick="changeScore('A', -1)" class="bg-slate-600 w-10 h-10 rounded-full">-</button>
                                    <button onclick="changeScore('A', 1)" class="bg-amber-500 w-10 h-10 rounded-full text-slate-900 font-bold">+</button>
                                </div>
                                <div id="playersOnCourtA" class="text-xs text-slate-400 space-y-1 bg-slate-900/50 p-3 rounded-lg min-h-[100px]"></div>
                                <button onclick="declareWinner('A')" class="mt-6 bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold uppercase text-white w-full">Vencer</button>
                            </div>

                            <div class="px-8 self-center text-4xl font-bold text-slate-500 italic">VS</div>

                            <div class="text-center flex-1">
                                <h3 id="scoreNameB" class="text-xl font-bold mb-2 text-amber-400">Time B</h3>
                                <div id="scoreB" class="text-7xl font-black text-white mb-4">0</div>
                                <div class="flex justify-center gap-2 mb-4">
                                    <button onclick="changeScore('B', -1)" class="bg-slate-600 w-10 h-10 rounded-full">-</button>
                                    <button onclick="changeScore('B', 1)" class="bg-amber-500 w-10 h-10 rounded-full text-slate-900 font-bold">+</button>
                                </div>
                                <div id="playersOnCourtB" class="text-xs text-slate-400 space-y-1 bg-slate-900/50 p-3 rounded-lg min-h-[100px]"></div>
                                <button onclick="declareWinner('B')" class="mt-6 bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold uppercase text-white w-full">Vencer</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArUdc3nC5vR74KwcPIlOEJZWpSL7PMV4A",
            authDomain: "volei-3165b.firebaseapp.com",
            databaseURL: "https://volei-3165b-default-rtdb.firebaseio.com",
            projectId: "volei-3165b",
            storageBucket: "volei-3165b.firebasestorage.app",
            messagingSenderId: "53003648552",
            appId: "1:53003648552:web:94d5bb7847f1d53b6dbf1d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const playersRef = collection(db, 'players');
        
        // Identificador único baseado no dia atual local
        const todayStr = new Date().toISOString().split('T')[0];
        const gameRef = doc(db, 'game', todayStr);
        const presenceRef = doc(db, 'presence', todayStr);

        let players = [];
        let currentTeams = [];
        let score = { A: 0, B: 0 };
        let currentMode = '';
        let teamAIndex = 0;
        let teamBIndex = 1;
        let nextTeamQueue = 2;
        let editingPlayerId = null;
        let presence = {};
        let shouldRedrawAfterMatch = false;
        let lastTeams = [];

        function saveGameState() {
            setDoc(gameRef, {
                currentTeams,
                score,
                currentMode,
                teamAIndex,
                teamBIndex,
                nextTeamQueue,
                shouldRedrawAfterMatch,
                lastTeams
            }, { merge: true });
        }

        onSnapshot(gameRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                currentTeams = data.currentTeams || [];
                score = data.score || { A: 0, B: 0 };
                currentMode = data.currentMode || '';
                teamAIndex = data.teamAIndex ?? 0;
                teamBIndex = data.teamBIndex ?? 1;
                nextTeamQueue = data.nextTeamQueue ?? 2;
                shouldRedrawAfterMatch = data.shouldRedrawAfterMatch || false;
                lastTeams = data.lastTeams || [];
                
                if (currentTeams.length > 0) {
                    renderDrawResults();
                    updateMatchDisplay();
                }
            }
        });

        // Escuta a presença diária de forma isolada
        onSnapshot(presenceRef, (snapshot) => {
            if (snapshot.exists()) {
                presence = snapshot.data() || {};
            } else {
                presence = {};
            }
            renderPlayers();
        });

        // Escuta o Banco de Dados de jogadores globais
        onSnapshot(playersRef, (snapshot) => {
            players = [];
            snapshot.forEach((doc) => {
                const id = doc.id;
                const data = doc.data();
                players.push({ id, ...data });
            });
            renderPlayers();
        });

        window.addPlayer = () => {
            const name = document.getElementById('playerName').value;
            const stars = parseInt(document.getElementById('playerStars').value);
            if (!name) return;
            
            if (editingPlayerId) {
                setDoc(doc(db, 'players', editingPlayerId), { name, stars });
                editingPlayerId = null;
                document.getElementById('addPlayerBtn').innerText = 'Adicionar e Salvar';
            } else {
                addDoc(playersRef, { name, stars });
            }
            document.getElementById('playerName').value = '';
        };

        window.startEditPlayer = (id) => {
            const player = players.find(p => p.id === id);
            if (!player) return;
            document.getElementById('playerName').value = player.name;
            document.getElementById('playerStars').value = player.stars;
            editingPlayerId = id;
            document.getElementById('addPlayerBtn').innerText = 'Salvar Alterações';
        };

        window.removePlayer = (id) => {
            if (editingPlayerId === id) {
                editingPlayerId = null;
                document.getElementById('addPlayerBtn').innerText = 'Adicionar e Salvar';
                document.getElementById('playerName').value = '';
            }
            deleteDoc(doc(db, 'players', id));
        };

        window.togglePresence = (id) => {
            const player = players.find(p => p.id === id);
            if (!player) return;
            
            const newPresence = !presence[id];
            presence[id] = newPresence;
            
            setDoc(presenceRef, presence);
            
            if (currentTeams && currentTeams.length > 0) {
                if (newPresence) {
                    const alreadyInTeam = currentTeams.some(t => t.members.some(m => m.id === id));
                    if (!alreadyInTeam) {
                        let sobressalente = currentTeams.find(t => t.name === 'Time Sobressalente');
                        if (sobressalente) {
                            sobressalente.members.push(player);
                        } else {
                            currentTeams.push({ name: 'Time Sobressalente', members: [player] });
                        }
                        renderDrawResults();
                    }
                } else {
                    currentTeams.forEach(t => {
                        t.members = t.members.filter(m => m.id !== id);
                    });
                    renderDrawResults();
                }
            }
            saveGameState();
            renderPlayers();
        };

        window.renderPlayers = renderPlayers;
        function renderPlayers() {
            const list = document.getElementById('playerList');
            document.getElementById('count').innerText = players.length;
            const searchVal = document.getElementById('searchPlayer') ? document.getElementById('searchPlayer').value.toLowerCase() : '';
            const filteredPlayers = players.filter(p => p.name.toLowerCase().includes(searchVal));
            
            list.innerHTML = filteredPlayers.map(p => `
                <li class="bg-slate-700 p-2 rounded flex justify-between items-center text-sm ${presence[p.id] ? 'border-l-4 border-green-500' : 'opacity-50'}">
                    <div class="flex items-center gap-2">
                        <button onclick="togglePresence('${p.id}')" class="transition ${presence[p.id] ? 'text-green-400' : 'text-slate-400 hover:text-white'}">
                            <i class="${presence[p.id] ? 'fas fa-check-circle' : 'far fa-circle'}"></i>
                        </button>
                        <span>${'⭐'.repeat(p.stars)} ${p.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="startEditPlayer('${p.id}')" class="text-amber-400 hover:text-amber-300 transition"><i class="fas fa-edit"></i></button>
                        <button onclick="removePlayer('${p.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-times"></i></button>
                    </div>
                </li>
            `).join('');
        }

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('tab-active'));
            if (tab === 'cadastro') {
                document.getElementById('tab-cadastro').classList.remove('hidden');
                document.getElementById('btn-cadastro').classList.add('tab-active');
            } else {
                currentMode = tab;
                document.getElementById('tab-modos').classList.remove('hidden');
                document.getElementById('btn-' + tab).classList.add('tab-active');
                renderModeOptions();
                showSubTab('sorteio');
                saveGameState();
            }
        };

        window.showSubTab = (sub) => {
            document.getElementById('sub-content-sorteio').classList.add('hidden');
            document.getElementById('sub-content-partida').classList.add('hidden');
            document.getElementById('sub-sorteio').style.backgroundColor = '#334155';
            document.getElementById('sub-partida').style.backgroundColor = '#334155';
            
            document.getElementById('sub-content-' + sub).classList.remove('hidden');
            document.getElementById('sub-' + sub).style.backgroundColor = '#f59e0b';
        };

        function renderModeOptions() {
            const extra = document.getElementById('extra-options');
            extra.innerHTML = (currentMode === 'times' || currentMode === 'continuo') ? `
                <label class="block text-xs uppercase text-slate-400 mb-1">Equilíbrio</label>
                <select id="balanceOpt" class="w-full bg-slate-700 p-2 rounded text-white">
                    <option value="aleatorio">Tudo Aleatório</option>
                    <option value="equilibrado">Equilibrado</option>
                </select>` : '';
        }

        window.drawTeams = () => {
            shouldRedrawAfterMatch = false;
            const pPerTeam = parseInt(document.getElementById('playersPerTeam').value);
            const presentPlayers = players.filter(p => presence[p.id]);
            
            if (presentPlayers.length < pPerTeam * 2) { alert("Mínimo 2 times com jogadores presentes!"); return; }

            // Mapeia os pares do sorteio anterior para calcular penalidade de repetição
            const lastPairs = new Set();
            if (lastTeams && lastTeams.length > 0) {
                lastTeams.forEach(t => {
                    for (let i = 0; i < t.members.length; i++) {
                        for (let j = i + 1; j < t.members.length; j++) {
                            const p1 = t.members[i].id;
                            const p2 = t.members[j].id;
                            lastPairs.add(p1 < p2 ? `${p1}_${p2}` : `${p2}_${p1}`);
                        }
                    }
                });
            }

            let bestTeams = [];
            let minPenalty = Infinity;

            // Executa várias simulações aleatórias buscando o melhor rodízio
            for (let iteration = 0; iteration < 100; iteration++) {
                let pool = [...presentPlayers].sort(() => Math.random() - 0.5);
                
                if ((currentMode === 'times' || currentMode === 'continuo') && document.getElementById('balanceOpt')?.value === 'equilibrado') {
                    pool.sort((a, b) => b.stars - a.stars);
                }

                const numTeams = Math.floor(pool.length / pPerTeam);
                let candidateTeams = [];
                for (let i = 0; i < numTeams; i++) candidateTeams.push({ name: `Time ${i + 1}`, members: [] });

                if (pool.length % pPerTeam > 0) {
                    candidateTeams.push({ name: `Time Sobressalente`, members: [] });
                }

                let teamIndex = 0;
                pool.forEach((player) => {
                    while (true) {
                        const team = candidateTeams[teamIndex];
                        const maxCap = team.name === 'Time Sobressalente' ? (pool.length % pPerTeam) : pPerTeam;
                        if (team.members.length < maxCap) {
                            team.members.push(player);
                            teamIndex = (teamIndex + 1) % candidateTeams.length;
                            break;
                        } else {
                            teamIndex = (teamIndex + 1) % candidateTeams.length;
                        }
                    }
                });

                // Calcula a pontuação de penalidade de repetição deste arranjo
                let penalty = 0;
                candidateTeams.forEach(t => {
                    for (let i = 0; i < t.members.length; i++) {
                        for (let j = i + 1; j < t.members.length; j++) {
                            const p1 = t.members[i].id;
                            const p2 = t.members[j].id;
                            const pairKey = p1 < p2 ? `${p1}_${p2}` : `${p2}_${p1}`;
                            if (lastPairs.has(pairKey)) {
                                penalty++;
                            }
                        }
                    }
                });

                if (penalty < minPenalty) {
                    minPenalty = penalty;
                    bestTeams = candidateTeams;
                    if (penalty === 0) break; 
                }
            }

            currentTeams = bestTeams;
            lastTeams = JSON.parse(JSON.stringify(currentTeams)); // Clona profundamente para a próxima rodada

            teamAIndex = 0; teamBIndex = 1; nextTeamQueue = 2;
            score = { A: 0, B: 0 };
            renderDrawResults();
            updateMatchDisplay();
            saveGameState();
        };

        function renderDrawResults() {
            const container = document.getElementById('drawResults');
            
            const teamWithBall = Math.random() > 0.5 ? 0 : 1;
            const sideTeam0 = Math.random() > 0.5 ? "Esquerdo" : "Direito";
            const sideTeam1 = sideTeam0 === "Esquerdo" ? "Direito" : "Esquerdo";

            container.innerHTML = currentTeams.map((t, idx) => `
                <div class="bg-slate-800/60 p-4 rounded-2xl border-l-4 border-amber-500">
                    <h4 class="font-bold text-amber-400 mb-2 uppercase">${t.name}</h4>
                    <ul class="space-y-1 text-sm text-slate-300">
                        ${t.members.map(m => `<li>${m.name} (${'⭐'.repeat(m.stars)})</li>`).join('')}
                    </ul>
                    ${idx < 2 ? `<div class="mt-2 text-[10px] text-green-400 font-bold uppercase">Em quadra - ${idx === teamWithBall ? '🏐 BOLA | ' : ''}🏗️ CAMPO: ${idx === 0 ? sideTeam0 : sideTeam1}</div>` : ''}
                </div>
            `).join('');
        }

        window.updateMatchDisplay = () => {
            const tA = currentTeams[teamAIndex];
            const tB = currentTeams[teamBIndex];
            if (!tA || !tB) return;
            document.getElementById('scoreNameA').innerText = tA.name;
            document.getElementById('scoreNameB').innerText = tB.name;
            document.getElementById('playersOnCourtA').innerHTML = tA.members.map(m => `<div>${m.name}</div>`).join('');
            document.getElementById('playersOnCourtB').innerHTML = tB.members.map(m => `<div>${m.name}</div>`).join('');
            document.getElementById('scoreA').innerText = score.A;
            document.getElementById('scoreB').innerText = score.B;
        };

        window.changeScore = (team, val) => {
            score[team] = Math.max(0, score[team] + val);
            document.getElementById('score' + team).innerText = score[team];
            saveGameState();
        };

        window.declareWinner = (winner) => {
            if (currentMode === 'continuo' && shouldRedrawAfterMatch) {
                window.drawTeams();
                return;
            }

            if (currentTeams.length < 3) {
                alert(`Vencedor: ${currentTeams[winner === 'A' ? teamAIndex : teamBIndex].name}!`);
                score = { A: 0, B: 0 };
                document.getElementById('scoreA').innerText = 0;
                document.getElementById('scoreB').innerText = 0;
                if (currentMode === 'continuo') {
                    window.drawTeams();
                } else {
                    saveGameState();
                }
                return;
            }
            if (winner === 'A') teamBIndex = nextTeamQueue;
            else teamAIndex = nextTeamQueue;

            nextTeamQueue++;
            if (nextTeamQueue >= currentTeams.length) {
                nextTeamQueue = 0;
                if (currentMode === 'continuo') shouldRedrawAfterMatch = true;
            }
            while (nextTeamQueue === teamAIndex || nextTeamQueue === teamBIndex) {
                nextTeamQueue++;
                if (nextTeamQueue >= currentTeams.length) {
                    nextTeamQueue = 0;
                    if (currentMode === 'continuo') shouldRedrawAfterMatch = true;
                }
            }
            score = { A: 0, B: 0 };
            updateMatchDisplay();
            saveGameState();
        };

        window.toggleBall = () => { alert("🏐 Bola com o " + (Math.random() > 0.5 ? "Time A" : "Time B")); };
        window.sortField = () => { alert("🏗️ Time A no lado " + (Math.random() > 0.5 ? "Esquerdo" : "Direito")); };

        // Inicialização
        const formattedDate = new Date().toLocaleDateString('pt-BR');
        document.getElementById('currentDate').innerText = formattedDate;
        showTab('cadastro');
    </script>
</body>
</html>
