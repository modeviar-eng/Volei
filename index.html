<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vôlei Pro - Ranking Avançado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #003566;
            --secondary: #ffc300;
            --accent: #000814;
            --white: #ffffff;
            --danger: #e63946;
            --success: #2a9d8f;
            --gray: #e9ecef;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; padding: 10px; }
        .container { width: 100%; max-width: 1000px; background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid var(--gray); padding-bottom: 0; overflow-x: auto; white-space: nowrap; }
        .tab-btn { padding: 10px 15px; font-size: 0.95em; background: var(--gray); color: var(--accent); border-radius: 10px 10px 0 0; cursor: pointer; border: none; font-weight: bold; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h1 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.8em; }
        
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; gap: 15px; } }
        
        input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px 20px; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-draw { background: var(--secondary); color: var(--accent); width: 100%; font-size: 1.2em; margin-top: 20px; }

        .court-area { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
        @media (max-width: 768px) { 
            .court-area { grid-template-columns: 1fr; } 
            .court-area > div:nth-child(2) { display: none; }
        }

        .team-card { background: #fff; border: 4px solid var(--primary); border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 10px; }
        .team-b { border-color: var(--secondary); }
        .status-box { font-weight: bold; color: var(--primary); margin-bottom: 10px; min-height: 20px; font-size: 0.85em; text-transform: uppercase; }
        
        .score-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; background: #f0f2f5; padding: 15px; border-radius: 15px; }
        
        /* PONTUAÇÃO AMPLIADA[cite: 1] */
        .score-display { font-size: 11em; font-weight: 900; min-width: 250px; line-height: 0.9; color: var(--accent); }
        
        @media (max-width: 600px) { 
            .score-display { font-size: 8em; min-width: 180px; } 
            .score-container { padding: 10px; }
        }
        
        .btn-score { padding: 20px 25px; font-size: 2em; background: #cbd5e0; border-radius: 10px; }
        .btn-score.plus { background: var(--primary); color: white; }
        .btn-score.plus-b { background: var(--secondary); color: var(--accent); }

        .player-tag { background: var(--gray); padding: 8px 10px; border-radius: 5px; margin: 4px; display: inline-flex; align-items: center; font-weight: 600; font-size: 0.9em; }
        .player-tag.highlight-sub { border: 2px solid var(--danger); background: #ffe3e3; }
        .sub-btn { margin-left: 8px; cursor: pointer; filter: grayscale(1); }
        .btn-win { background: var(--success); color: white; margin-top: 15px; width: 100%; font-size: 1.1em; }

        #post-match-options { display: none; background: #fff; border: 2px solid var(--primary); padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .btn-confirm-match { background: var(--success); color: white; width: 100%; margin-top: 15px; font-size: 1.2em; display: none; }

        .capture-area { padding: 10px; border-radius: 15px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); margin-top: 10px; }
        .ranking-box { padding: 5px; border-radius: 15px; }
        .ranking-item { background: white; border-radius: 12px; margin-bottom: 10px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-left: 8px solid var(--primary); position: relative; }
        .rank-1 { border-left-color: var(--gold); border: 1px solid var(--gold); border-left: 8px solid var(--gold); }
        .rank-2 { border-left-color: var(--silver); }
        .rank-3 { border-left-color: var(--bronze); }

        .ranking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .rank-pos { font-size: 1.1em; font-weight: 900; color: var(--primary); }
        .rank-win-count { background: var(--primary); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .rank-1 .rank-win-count { background: var(--gold); color: var(--accent); }
        
        .player-names { color: #444; font-weight: 500; line-height: 1.3; border-top: 1px solid #eee; margin-top: 6px; padding-top: 6px; font-size: 0.85em; }
        .btn-img { background: var(--accent); color: white; padding: 10px; font-size: 0.9em; margin-bottom: 15px; width: 100%; }
        
        .badge-waiting { background: #6c757d; color: white; padding: 6px 12px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 0.85em; }
        .badge-waiting.can-select { background: var(--success); cursor: pointer; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tab-cadastro')">📝 Cadastro</button>
        <button class="tab-btn" onclick="openTab('tab-partida')">🏐 Partida</button>
        <button class="tab-btn" onclick="openTab('tab-ranking')">🏆 Ranking</button>
    </div>

    <div id="tab-cadastro" class="tab-content active">
        <h1>Configuração</h1>
        <div class="setup-grid">
            <div>
                <label>Jogador:</label>
                <input type="text" id="playerName" placeholder="Nome e Enter" onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addPlayer()">Adicionar</button>
            </div>
            <div>
                <label>Tamanho Time:</label>
                <input type="number" id="teamSize" value="6">
                <div style="margin-top:10px; display: flex; gap: 15px;">
                    <label><input type="checkbox" id="drawSide"> Lado</label>
                    <label><input type="checkbox" id="drawBall"> Bola</label>
                </div>
            </div>
        </div>
        <div id="playerPool"></div>
        <button class="btn-draw" onclick="initialDraw()">INICIAR TUDO</button>
    </div>

    <div id="tab-partida" class="tab-content">
        <div id="court-placeholder" style="text-align:center; padding:30px;"><h2>Inicie no cadastro.</h2></div>
        <div id="post-match-options">
            <h3 id="winner-msg"></h3>
            <button class="btn-add" onclick="processRotation('auto')">Auto (Gira Fila)</button>
            <button class="btn-draw" style="margin-top:10px" onclick="processRotation('manual')">Manual (Ajustar)</button>
        </div>
        <button id="btnConfirmManual" class="btn-confirm-match" onclick="finalizeManualRotation()">CONFIRMAR TIMES</button>
        <div id="court" class="court-area" style="display:none;">
            <div class="team-card team-a">
                <div id="statusA" class="status-box"></div>
                <div class="score-container">
                    <button class="btn-score" onclick="changeScore('A', -1)">-</button>
                    <div id="scoreA" class="score-display">00</div>
                    <button class="btn-score plus" onclick="changeScore('A', 1)">+</button>
                </div>
                <div id="playersA"></div>
                <button id="winA" class="btn-win" onclick="handleWin('A')">Venceu</button>
            </div>
            <div style="align-self:center; font-weight:bold; text-align:center;">VS</div>
            <div class="team-card team-b">
                <div id="statusB" class="status-box"></div>
                <div class="score-container">
                    <button class="btn-score" onclick="changeScore('B', -1)">-</button>
                    <div id="scoreB" class="score-display">00</div>
                    <button class="btn-score plus-b" onclick="changeScore('B', 1)">+</button>
                </div>
                <div id="playersB"></div>
                <button id="winB" class="btn-win" onclick="handleWin('B')">Venceu</button>
            </div>
        </div>
        <div id="waitingSection" style="display:none; margin-top:20px;">
            <h4>Fila de Espera:</h4>
            <div id="waitingListUI"></div>
        </div>
    </div>

    <div id="tab-ranking" class="tab-content">
        <h1>🏆 Rankings</h1>
        <div class="setup-grid">
            <div>
                <h3>Melhores do Dia</h3>
                <input type="date" id="rankingDate" onchange="renderRanking()">
                <label style="margin-top:10px; display:block;">Qtd:</label>
                <input type="number" id="dailyLimit" value="3" min="1" onchange="renderRanking()">
                <button class="btn-img" onclick="saveAsImg('capture-daily', 'ranking-diario')">📸 Salvar Imagem Diária</button>
                <div id="capture-daily" class="capture-area">
                    <h2 style="text-align:center; color:var(--primary); margin-bottom:15px; font-size:1.1em;">🏆 TOP DIÁRIO</h2>
                    <div id="rankingDailyList" class="ranking-box"></div>
                </div>
            </div>
            <div>
                <h3>Ranking Geral</h3>
                <label style="margin-top:10px; display:block;">Qtd:</label>
                <input type="number" id="rankingLimit" value="5" min="1" onchange="renderRanking()">
                <button class="btn-img" onclick="saveAsImg('capture-geral', 'ranking-geral')">📸 Salvar Imagem Geral</button>
                <div id="capture-geral" class="capture-area">
                    <h2 style="text-align:center; color:var(--primary); margin-bottom:15px; font-size:1.1em;">🔥 LENDAS DO VÔLEI</h2>
                    <div id="rankingOverallList" class="ranking-box"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArUdc3nC5vR74KwcPIlOEJZWpSL7PMV4A",
        authDomain: "volei-3165b.firebaseapp.com",
        databaseURL: "https://volei-3165b-default-rtdb.firebaseio.com",
        projectId: "volei-3165b",
        storageBucket: "volei-3165b.firebasestorage.app",
        messagingSenderId: "53003648552",
        appId: "1:53003648552:web:94d5bb7847f1d53b6dbf1d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'jogadores');
    const rankingsRef = ref(db, 'rankings');

    let allPlayers = [], teamA = [], teamB = [], waitingQueue = [];
    let scoreA = 0, scoreB = 0, lastWinner = null, pendingSub = null, localRankings = {};
    let statusMsgA = "", statusMsgB = "";

    document.getElementById('rankingDate').valueAsDate = new Date();

    window.openTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const activeTab = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(id));
        if(activeTab) activeTab.classList.add('active');
        if(id === 'tab-ranking') renderRanking();
    };

    onValue(playersRef, s => {
        const d = s.val();
        allPlayers = d ? Object.values(d) : [];
        renderPool(d);
    });

    onValue(rankingsRef, s => {
        localRankings = s.val() || {};
        renderRanking();
    });

    function renderPool(d) {
        document.getElementById('playerPool').innerHTML = d ? Object.entries(d).map(([k,v]) => `
            <span class="player-tag">${v} <span style="color:red;cursor:pointer" onclick="removePlayer('${k}')">×</span></span>
        `).join('') : '';
    }

    window.addPlayer = () => {
        const i = document.getElementById('playerName');
        if(i.value.trim()) set(ref(db, 'jogadores/' + Date.now()), i.value.trim());
        i.value = '';
    };
    window.removePlayer = (k) => remove(ref(db, 'jogadores/' + k));

    window.initialDraw = () => {
        const s = parseInt(document.getElementById('teamSize').value);
        if(allPlayers.length < s*2) return alert("Poucos jogadores!");
        let shuf = [...allPlayers].sort(() => Math.random() - 0.5);
        teamA = shuf.slice(0,s); teamB = shuf.slice(s, s*2); waitingQueue = shuf.slice(s*2);
        
        statusMsgA = ""; statusMsgB = "";
        if(document.getElementById('drawSide').checked) {
            const sideA = Math.random() < 0.5 ? "Lado Esquerdo" : "Lado Direito";
            statusMsgA = sideA;
            statusMsgB = sideA === "Lado Esquerdo" ? "Lado Direito" : "Lado Esquerdo";
        }
        if(document.getElementById('drawBall').checked) {
            const ballA = Math.random() < 0.5;
            statusMsgA += (statusMsgA ? " | " : "") + (ballA ? "🏐 Bola" : "");
            statusMsgB += (statusMsgB ? " | " : "") + (ballA ? "" : "🏐 Bola");
        }

        openTab('tab-partida'); 
        resetS();
    };

    function renderMatchUI() {
        document.getElementById('court').style.display = 'grid';
        document.getElementById('court-placeholder').style.display = 'none';
        document.getElementById('waitingSection').style.display = 'block';
        
        document.getElementById('statusA').innerText = statusMsgA;
        document.getElementById('statusB').innerText = statusMsgB;

        const drawP = (t, id) => t.map((p,i) => `
            <div class="player-tag ${pendingSub?.team===id && pendingSub?.index===i ? 'highlight-sub':''}">
                ${p} <span class="sub-btn" onclick="startSub('${id}',${i})">🔄</span>
            </div>`).join('');
        document.getElementById('playersA').innerHTML = drawP(teamA, 'A');
        document.getElementById('playersB').innerHTML = drawP(teamB, 'B');
        document.getElementById('waitingListUI').innerHTML = waitingQueue.map((p,i) => `
            <span class="badge-waiting ${pendingSub?'can-select':''}" onclick="completeSub(${i})">${p}</span>
        `).join('');
    }

    window.startSub = (t, i) => { pendingSub = {team:t, index:i}; renderMatchUI(); };
    window.completeSub = (qi) => {
        if(!pendingSub) return;
        const tArr = pendingSub.team === 'A' ? teamA : teamB;
        const old = tArr[pendingSub.index];
        tArr[pendingSub.index] = waitingQueue.splice(qi, 1)[0];
        waitingQueue.push(old);
        pendingSub = null; renderMatchUI();
    };

    window.handleWin = (w) => {
        lastWinner = w;
        document.getElementById('winner-msg').innerText = "Time " + w + " venceu!";
        document.getElementById('post-match-options').style.display = 'block';
        const winT = w === 'A' ? [...teamA] : [...teamB];
        const cleanT = winT.sort();
        const tKey = btoa(unescape(encodeURIComponent(cleanT.join('|')))).replace(/[/+=]/g, '');
        const date = document.getElementById('rankingDate').value.replace(/\//g, '-');
        
        const curD = (localRankings.daily?.[date]?.[tKey]?.wins) || 0;
        const curG = (localRankings.geral?.[tKey]?.wins) || 0;

        set(ref(db, `rankings/daily/${date}/${tKey}`), {names: cleanT, wins: curD + 1});
        set(ref(db, `rankings/geral/${tKey}`), {names: cleanT, wins: curG + 1});
    };

    window.processRotation = (m) => {
        statusMsgA = ""; statusMsgB = "";
        document.getElementById('post-match-options').style.display = 'none';
        if(m === 'auto'){
            const s = parseInt(document.getElementById('teamSize').value);
            if(lastWinner === 'A') { waitingQueue.push(...teamB); teamB = waitingQueue.splice(0,s); }
            else { waitingQueue.push(...teamA); teamA = waitingQueue.splice(0,s); }
            resetS();
        } else {
            document.getElementById('btnConfirmManual').style.display = 'block';
        }
    };

    window.finalizeManualRotation = () => {
        document.getElementById('btnConfirmManual').style.display = 'none';
        resetS();
    };

    function resetS() { 
        scoreA = 0; scoreB = 0; 
        document.getElementById('scoreA').innerText = '00'; 
        document.getElementById('scoreB').innerText = '00'; 
        renderMatchUI(); 
    }

    window.changeScore = (t,v) => {
        if(t==='A') scoreA = Math.max(0, scoreA+v); else scoreB = Math.max(0, scoreB+v);
        document.getElementById('scoreA').innerText = scoreA.toString().padStart(2,'0');
        document.getElementById('scoreB').innerText = scoreB.toString().padStart(2,'0');
    };

    window.renderRanking = () => {
        const date = document.getElementById('rankingDate').value;
        const dLim = parseInt(document.getElementById('dailyLimit').value) || 3;
        const gLim = parseInt(document.getElementById('rankingLimit').value) || 5;

        const dData = Object.values(localRankings.daily?.[date] || {}).sort((a,b) => b.wins - a.wins).slice(0, dLim);
        const gData = Object.values(localRankings.geral || {}).sort((a,b) => b.wins - a.wins).slice(0, gLim);

        const medal = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';

        const html = (data) => data.map((t,i) => `
            <div class="ranking-item rank-${i+1}">
                <div class="ranking-header">
                    <span class="rank-pos">${medal(i)} ${i+1}º Lugar</span> 
                    <span class="rank-win-count">${t.wins} VITÓRIAS</span>
                </div>
                <div class="player-names">${t.names.join(', ')}</div>
            </div>
        `).join('') || '<div style="text-align:center;color:#999">Nenhuma partida registrada</div>';

        document.getElementById('rankingDailyList').innerHTML = html(dData);
        document.getElementById('rankingOverallList').innerHTML = html(gData);
    };

    window.saveAsImg = (divId, name) => {
        const area = document.getElementById(divId);
        html2canvas(area, {
            backgroundColor: "#f0f2f5",
            scale: 2,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `${name}-${new Date().toLocaleDateString()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    };

    window.handleKeyPress = (e) => { if(e.key === 'Enter') addPlayer(); };
</script>
</body>
</html>
